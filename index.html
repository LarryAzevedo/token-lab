<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token lab demo</title>
  <link rel="stylesheet" href="dist/tokens.css">
  <style>
    /* Components use ONLY semantic tokens. No --_ primitives here. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 1rem/1.5 system-ui, sans-serif;
      background: var(--color-bg-subtle);
      color: var(--color-text-default);
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }
    .card {
      max-width: 28rem;
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-default);
      border-radius: 0.75rem;
      padding: 1.5rem;
    }
    .card h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    .card p { margin: 0 0 1.25rem; color: var(--color-text-subtle); }
    .button {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 0.5rem;
      padding: 0.625rem 1rem;
      background: var(--color-action-primary);
      color: var(--color-action-on-primary);
      cursor: pointer;
    }
    .button:hover { background: var(--color-action-primary-hover); }
    .button:focus-visible { outline: 2px solid var(--color-action-primary); outline-offset: 2px; }
    fieldset { border: 0; padding: 0; margin: 1.5rem 0 0; }
    legend { font-size: 0.875rem; color: var(--color-text-subtle); margin-bottom: 0.25rem; }
    label { margin-right: 1rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello from your tokens</h1>
    <p>Every color on this card comes from dist/tokens.css. Change a token in Tokens Studio, push, and this page updates after the build runs.</p>
    <button class="button" type="button">Primary action</button>

    <fieldset>
      <legend>Color mode</legend>
      <label><input type="radio" name="mode" value="system" checked> Match system</label>
      <label><input type="radio" name="mode" value="light"> Light</label>
      <label><input type="radio" name="mode" value="dark"> Dark</label>
    </fieldset>
  </main>

  <script>
    document.querySelectorAll('input[name="mode"]').forEach((input) => {
      input.addEventListener('change', () => {
        if (input.value === 'system') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.dataset.theme = input.value;
        }
      });
    });
  </script>
</body>
</html>
